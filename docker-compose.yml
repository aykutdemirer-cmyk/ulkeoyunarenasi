# Üretim kurulumu: uygulama + Caddy (otomatik HTTPS / Let's Encrypt)
# Kullanım: .env dosyasına DOMAIN=alanadin.com yaz, sonra: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı değil (.env dosyasına DOMAIN=alanadin.com yaz)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
