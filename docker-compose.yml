# Üretim: uygulama + Caddy (otomatik HTTPS). Ayarlar .env dosyasından okunur (bkz. deploy/provision.sh, DEPLOY.md)
services:
  app:
    image: ghcr.io/${GHCR_IMAGE:-aykutdemirer-cmyk/ulkeoyunarenasi}:${APP_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_TAG:-dev}
    restart: unless-stopped
    environment:
      PORT: "3000"
      TRUST_PROXY: "1"
      REGION: ${REGION:-local}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      REGIONS_FILE: /app/regions.json
      MAX_ROOMS: ${MAX_ROOMS:-300}
      MAX_CONN_PER_IP: ${MAX_CONN_PER_IP:-25}
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
    volumes:
      - ${REGIONS_FILE_HOST:-./deploy/regions.empty.json}:/app/regions.json:ro
      - gamedata:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlı değil (.env dosyasına DOMAIN=alanadin.com yaz)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gamedata:
  caddy_data:
  caddy_config:
