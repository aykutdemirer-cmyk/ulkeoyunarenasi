name: Deploy

# main'e her birleşmede: test -> imaj derle (GHCR) -> sunuculara güvenli SSH ile dağıt.
# Kurulum: DEPLOY.md > "GitHub'dan otomatik dağıtım"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          node --check server.js
          for f in public/*.js scripts/*.mjs; do node --check "$f"; done
      - run: npm run smoke

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    # Sunucu listesi tanımlı değilse (Settings > Variables > DEPLOY_HOSTS) dağıtım atlanır.
    if: ${{ vars.DEPLOY_HOSTS != '' }}
    runs-on: ubuntu-latest
    environment: production   # istersen Settings > Environments'ta elle onay şartı koy
    steps:
      - name: SSH hazırla
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Sunuculara dağıt
        env:
          HOSTS: ${{ vars.DEPLOY_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          for host in $HOSTS; do
            echo "==> $host"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "deploy@$host" "$SHA"
          done
