name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sözdizimi kontrolü
        run: |
          node --check server.js
          for f in public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Duman testi (sunucu + oda + bot maçı)
        run: npm run smoke
